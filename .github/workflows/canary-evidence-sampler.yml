name: local-private-tester-canary-contract

# Intentionally manual and local-only. This is a disposable contract check, not
# a scheduler, rollout controller, production sampler, or kill-switch caller.
on:
  workflow_dispatch:
    inputs:
      local_identity_json:
        description: Disposable release/build/deployment identity JSON
        required: true
        type: string
      local_proof_json:
        description: Disposable Task 5/6 proof JSON
        required: true
        type: string

permissions: { contents: read }

jobs:
  local-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Record one disposable generation-zero sample
        env:
          LOCAL_CANARY_EVIDENCE: "true"
          LOCAL_IDENTITY: ${{ inputs.local_identity_json }}
          LOCAL_PROOF: ${{ inputs.local_proof_json }}
        run: node --import tsx scripts/canary-evidence-cli.ts sample-local "$RUNNER_TEMP" "$LOCAL_IDENTITY" "$LOCAL_PROOF"
