name: canary-evidence-sampler
on:
  schedule: [{ cron: "* * * * *" }]
  workflow_dispatch:
permissions: { contents: read, id-token: write }
jobs:
  sample:
    runs-on: ubuntu-latest
    environment: production-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - id: google-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_EVIDENCE_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_EVIDENCE_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ vars.CANARY_METRICS_AUDIENCE }}
      - name: Record one durable PostgreSQL sample
        env:
          READINESS_CONTROL_DATABASE_URL: ${{ secrets.READINESS_CONTROL_DATABASE_URL }}
          RELEASE_ID: ${{ vars.RELEASE_ID }}
          CANARY_METRICS_URL: ${{ vars.CANARY_METRICS_URL }}
          CANARY_METRICS_TOKEN: ${{ steps.google-auth.outputs.id_token }}
        run: node --import tsx scripts/canary-evidence-cli.ts sample
