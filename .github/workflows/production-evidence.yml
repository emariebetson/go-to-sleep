name: production-evidence
# Manual evidence collection only. This workflow does not deploy or enable product flags.
on: [workflow_dispatch]
permissions:
  contents: read
  id-token: write
jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    environment: production-evidence
    services:
      postgres:
        image: pgvector/pgvector@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Apply PostgreSQL migrations 0001-0014 in reviewed order
        env:
          READINESS_CONTROL_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres"
          NEARYOU_CATALOG_DATABASE_DISPOSABLE: "true"
        run: node --import tsx scripts/apply-catalog-migrations.ts
      - name: Generate review-only live catalog candidate
        env: { READINESS_CONTROL_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres" }
        run: node --import tsx scripts/catalog-candidate.ts postgres/catalog-manifest.candidate.json
      - name: Execute RLS role gate
        env: { PGPASSWORD: postgres }
        run: mkdir -p postgres/evidence && psql -qAt -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/postgres-rls-gate.sql > postgres/evidence/rls-observed.json
      - name: Bind successful RLS execution to release and schema
        env:
          RELEASE_ID: ${{ vars.RELEASE_ID }}
          SCHEMA_CHECKSUM: ${{ vars.EVIDENCE_SCHEMA_CHECKSUM }}
        run: node --import tsx scripts/rls-evidence.ts postgres/evidence/rls-observed.json postgres/rls-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: catalog-manifest-review-candidate, path: postgres/catalog-manifest.candidate.json }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rls-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: postgres/rls-evidence.json
          if-no-files-found: error
  nearfamily-decision-proof:
    runs-on: ubuntu-latest
    environment: production-evidence
    services:
      postgres:
        image: pgvector/pgvector@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: nearyou }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Prove private-tester controller and emergency-kill contracts
        run: |
          npm run typecheck
          node --import tsx --test tests/private-tester-activation.test.mjs tests/readiness-gateway-contract.test.mjs tests/readiness-gateway-infrastructure.test.mjs
      - name: Prove fixed NearFamily decision authority on disposable PostgreSQL 16
        env:
          NEARYOU_TEST_POSTGRES16_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/nearyou"
          NEARYOU_TEST_POSTGRES16_DISPOSABLE: "true"
        run: |
          set -euo pipefail
          mkdir -p evidence
          node --import tsx scripts/verify-nearfamily-private-decision-proof.ts | tee evidence/nearfamily-private-decision-proof.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nearfamily-private-decision-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/nearfamily-private-decision-proof.log
          if-no-files-found: warn
  readiness-gateway-image:
    needs: nearfamily-decision-proof
    runs-on: ubuntu-latest
    environment: production-evidence
    outputs:
      gateway-image: ${{ steps.build-images.outputs.gateway_image }}
      database-proof-image: ${{ steps.build-images.outputs.database_proof_image }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: image-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_EVIDENCE_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_EVIDENCE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: ">= 548.0.0"
      - name: Build immutable disposable controller image
        id: build-images
        run: |
          set -euo pipefail
          test "${{ vars.GCP_PROJECT }}" = "nearnight"
          mkdir -p evidence
          export DOCKER_CONFIG="$RUNNER_TEMP/nearfamily-docker-config"
          mkdir -p "$DOCKER_CONFIG"
          builder='gcr.io/cloud-builders/docker@sha256:2e8d40d8e48dc14fab4213d5e532d74f63fd403d9e8d7f6463096a75820286c3'
          gcloud auth print-access-token | docker run --rm -i -v "$DOCKER_CONFIG:/root/.docker" "$builder" login -u oauth2accesstoken --password-stdin us-central1-docker.pkg.dev
          gateway="us-central1-docker.pkg.dev/nearnight/nearyou-prep/readiness-gateway:$GITHUB_SHA"
          database_proof="us-central1-docker.pkg.dev/nearnight/nearyou-prep/readiness-database-proof:$GITHUB_SHA"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/workspace" -v "$DOCKER_CONFIG:/root/.docker" -w /workspace "$builder" build --file services/readiness-gateway/Dockerfile --tag "$gateway" .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$DOCKER_CONFIG:/root/.docker" "$builder" push "$gateway"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/workspace" -v "$DOCKER_CONFIG:/root/.docker" -w /workspace "$builder" build --file Dockerfile.readiness-database-proof --tag "$database_proof" .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$DOCKER_CONFIG:/root/.docker" "$builder" push "$database_proof"
          gcloud artifacts docker images describe "us-central1-docker.pkg.dev/nearnight/nearyou-prep/readiness-gateway:$GITHUB_SHA" --project=nearnight --format=json > evidence/readiness-gateway-image.json
          gcloud artifacts docker images describe "us-central1-docker.pkg.dev/nearnight/nearyou-prep/readiness-database-proof:$GITHUB_SHA" --project=nearnight --format=json > evidence/readiness-database-proof-image.json
          gateway_digest="$(jq -r .image_summary.fully_qualified_digest evidence/readiness-gateway-image.json)"
          database_proof_digest="$(jq -r .image_summary.fully_qualified_digest evidence/readiness-database-proof-image.json)"
          printf 'gateway_image=%s\ndatabase_proof_image=%s\n' "$gateway_digest" "$database_proof_digest" >> "$GITHUB_OUTPUT"
          jq -n --arg commit "$GITHUB_SHA" --arg builder "$builder" --arg gateway "$gateway_digest" --arg databaseProof "$database_proof_digest" '{version:1,commit:$commit,builder:$builder,gateway:$gateway,databaseProof:$databaseProof}' > evidence/readiness-gateway-image-build.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readiness-gateway-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/readiness-gateway-image*.json
            evidence/readiness-database-proof-image.json
          if-no-files-found: error
          retention-days: 90
  readiness-gateway-disposable-roles:
    needs: [nearfamily-decision-proof, readiness-gateway-image]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-evidence
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - id: role-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_EVIDENCE_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_EVIDENCE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: ">= 548.0.0"
      - name: Assign and read back disposable gateway database roles
        env:
          NEARYOU_CLOUD_SQL_ROLE_PROJECT: nearnight
          NEARYOU_CLOUD_SQL_ROLE_INSTANCE: nearyou-evidence-20260820
          NEARYOU_CLOUD_SQL_ROLE_DISPOSABLE: "true"
          NEARYOU_CLOUD_SQL_ROLE_CONFIRMATION: DISPOSABLE_ROLE_ASSIGNMENT_nearnight_nearyou-evidence-20260820
          NEARYOU_CLOUD_SQL_ROLE_OPERATION_SEED: ${{ github.run_id }}:${{ github.run_attempt }}:${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          node --import tsx scripts/cloud-sql-role-assignment-plan.ts evidence/readiness-gateway-disposable-role-receipt.json
      - name: Execute private database migration and identity proof
        run: |
          set -euo pipefail
          proof_image='${{ needs.readiness-gateway-image.outputs.database-proof-image }}'
          printf '%s' "$proof_image" | grep -Eq '^us-central1-docker\.pkg\.dev/nearnight/nearyou-prep/readiness-database-proof@sha256:[a-f0-9]{64}$'
          test "$(gcloud artifacts docker images describe "us-central1-docker.pkg.dev/nearnight/nearyou-prep/readiness-database-proof:$GITHUB_SHA" --project=nearnight --format='value(image_summary.fully_qualified_digest)')" = "$proof_image"
          gcloud run jobs deploy nf-rdy-database-proof --project=nearnight --region=us-central1 --image="$proof_image" --service-account=nearyou-prod-migration@nearnight.iam.gserviceaccount.com --network=nearyou-production --subnet=nearyou-production --vpc-egress=private-ranges-only --set-secrets=/var/run/secrets/nearyou/database-url=nf-rdy-disposable-migration-admin:2 --set-env-vars=NEARYOU_GATEWAY_DATABASE_INSTANCE=nearnight:us-central1:nearyou-evidence-20260820,NEARYOU_GATEWAY_DATABASE_DISPOSABLE=true --args=/var/run/secrets/nearyou/database-url --labels=nearyou-disposable-instance=nearyou-evidence-20260820,nearyou-migration-head=0014 --max-retries=0 --task-timeout=5m --quiet
          gcloud run jobs describe nf-rdy-database-proof --project=nearnight --region=us-central1 --format=json > evidence/readiness-gateway-database-proof-job.json
          jq -e --arg image "$proof_image" '.metadata.labels["nearyou-disposable-instance"] == "nearyou-evidence-20260820" and .metadata.labels["nearyou-migration-head"] == "0014" and .spec.template.spec.template.spec.serviceAccountName == "nearyou-prod-migration@nearnight.iam.gserviceaccount.com" and .spec.template.spec.template.spec.containers[0].image == $image' evidence/readiness-gateway-database-proof-job.json >/dev/null
          jq -e --arg image "$proof_image" -f scripts/verify-disposable-proof-template.jq evidence/readiness-gateway-database-proof-job.json >/dev/null
          execution="$(gcloud run jobs execute nf-rdy-database-proof --project=nearnight --region=us-central1 --async --format='value(metadata.name)')"
          printf '%s' "$execution" | grep -Eq '^nf-rdy-database-proof-[a-z0-9]+$'
          for attempt in $(seq 1 90); do
            gcloud run jobs executions describe "$execution" --project=nearnight --region=us-central1 --format=json > evidence/readiness-gateway-database-proof-execution.json
            if jq -e '.status.conditions[]? | select(.type == "Completed" and (.status == "True" or .status == "False"))' evidence/readiness-gateway-database-proof-execution.json >/dev/null; then break; fi
            sleep 5
          done
          jq -e --arg image "$proof_image" -f scripts/verify-disposable-proof-template.jq evidence/readiness-gateway-database-proof-execution.json >/dev/null
          gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"nf-rdy-database-proof\" AND labels.\"run.googleapis.com/execution_name\"=\"$execution\"" --project=nearnight --freshness=15m --limit=100 --order=asc --format=json > evidence/readiness-gateway-database-proof-log.json
          jq -ce '[.[] | .jsonPayload? | select(.version == 1 and .disposable == true and .instance == "nearnight:us-central1:nearyou-evidence-20260820")][0]' evidence/readiness-gateway-database-proof-log.json > evidence/readiness-gateway-database-proof-receipt.json || true
          jq -e '.status.conditions[] | select(.type == "Completed" and .status == "True")' evidence/readiness-gateway-database-proof-execution.json >/dev/null
          test -s evidence/readiness-gateway-database-proof-receipt.json
          jq -e '.disposable == true and .migrationHead == "0014_release_policy_evidence_read" and .controller.mapped == true and .kill.mapped == true and .laneIsolation == true' evidence/readiness-gateway-database-proof-receipt.json >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: readiness-gateway-disposable-role-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/readiness-gateway-disposable-role-receipt.json
            evidence/readiness-gateway-database-proof-job.json
            evidence/readiness-gateway-database-proof-execution.json
            evidence/readiness-gateway-database-proof-log.json
            evidence/readiness-gateway-database-proof-receipt.json
          if-no-files-found: error
          retention-days: 90
  operational-evidence:
    needs: [postgres-contract, nearfamily-decision-proof]
    runs-on: ubuntu-latest
    env:
      RELEASE_ID: ${{ vars.RELEASE_ID }}
      SCHEMA_CHECKSUM: ${{ vars.EVIDENCE_SCHEMA_CHECKSUM }}
    environment: production-evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0 axe-core@4.13.0 && npx playwright install --with-deps chromium
      - run: mkdir -p evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rls-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - id: restore-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_EVIDENCE_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_EVIDENCE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
      - name: load operational-evidence
        env:
          LOAD_URLS: ${{ vars.LOAD_URLS }}
          LOAD_REQUESTS: ${{ vars.LOAD_REQUESTS }}
          LOAD_MAX_P95_MS: ${{ vars.LOAD_MAX_P95_MS }}
          LOAD_MAX_ERROR_BPS: ${{ vars.LOAD_MAX_ERROR_BPS }}
        run: node --import tsx scripts/collect-operational-gate.ts load evidence/load.json
      - name: restore operational-evidence
        env:
          CLOUD_SQL_RESTORE_OPERATION: ${{ secrets.CLOUD_SQL_RESTORE_OPERATION }}
          RESTORE_GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          RESTORE_EXPECTED_CHECKSUM: ${{ secrets.RESTORE_EXPECTED_CHECKSUM }}
          RESTORE_EXPECTED_CATALOG_CHECKSUM: ${{ secrets.RESTORE_EXPECTED_CATALOG_CHECKSUM }}
          RESTORED_DATABASE_URL: ${{ secrets.RESTORED_DATABASE_URL }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.restore-auth.outputs.access_token }}
        run: node --import tsx scripts/restore-evidence-cli.ts evidence/restore.json
      - name: accessibility operational-evidence
        env: { ACCESSIBILITY_URLS: "${{ vars.ACCESSIBILITY_URLS }}" }
        run: node --import tsx scripts/accessibility-gate.ts evidence/accessibility.json
      - name: authenticated OWASP ZAP staging evidence
        run: docker run --rm -v "$PWD/evidence:/zap/wrk:rw" zaproxy/zap-stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef zap-baseline.py -t "${{ vars.SECURITY_STAGING_URL }}" -J zap.json
      - name: security operational-evidence
        run: |
          set -euo pipefail
          npm audit --json > evidence/npm-audit.json || test -s evidence/npm-audit.json
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 detect --source=/repo --report-format=json --report-path=/repo/evidence/gitleaks.json --no-banner
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.130.0 semgrep scan --config=p/owasp-top-ten --json --output=/src/evidence/semgrep.json /src
          node --import tsx scripts/security-evidence-cli.ts evidence/security.json evidence/npm-audit.json evidence/gitleaks.json evidence/semgrep.json evidence/zap.json
      - name: Mint fresh media identity
        id: media-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_EVIDENCE_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_EVIDENCE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s
      - name: media operational-evidence
        env:
          STORY_CANARY_URL: ${{ vars.STORY_CANARY_URL }}
          LEGACY_CANARY_URL: ${{ vars.LEGACY_CANARY_URL }}
          MEDIA_CANARY_SERVICE_ACCOUNT: ${{ vars.MEDIA_CANARY_SERVICE_ACCOUNT }}
          MEDIA_CANARY_AUDIENCE: ${{ vars.MEDIA_CANARY_AUDIENCE }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.media-auth.outputs.access_token }}
          RELEASE_ID: ${{ vars.RELEASE_ID }}
        run: node --import tsx scripts/media-evidence-cli.ts evidence/media.json
      - name: Cryptographically verify the durable private-tester canary receipt
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.media-auth.outputs.access_token }}
          PRIVATE_TESTER_EVIDENCE_BUCKET: ${{ vars.PRIVATE_TESTER_EVIDENCE_BUCKET }}
          CANARY_IDENTITY_JSON: ${{ vars.PRIVATE_TESTER_CANARY_IDENTITY_JSON }}
          PRIVATE_TESTER_CANARY_BUILD_ID: ${{ vars.PRIVATE_TESTER_CANARY_BUILD_ID }}
          PRIVATE_TESTER_CANARY_DEPLOYMENT_ID: ${{ vars.PRIVATE_TESTER_CANARY_DEPLOYMENT_ID }}
          RELEASE_ID: ${{ vars.RELEASE_ID }}
          CANARY_ROLLBACK_PROOF_JSON: ${{ secrets.PRIVATE_TESTER_CANARY_ROLLBACK_PROOF_JSON }}
          KMS_PROJECT: ${{ vars.KMS_PROJECT }}
          KMS_LOCATION: ${{ vars.KMS_LOCATION }}
          KMS_KEY_RING: ${{ vars.KMS_KEY_RING }}
          KMS_KEY: ${{ vars.KMS_KEY }}
          EVIDENCE_PRINCIPAL: ${{ vars.EVIDENCE_PRINCIPAL }}
          EVIDENCE_KEY_ID: ${{ vars.EVIDENCE_KEY_ID }}
          EVIDENCE_KEY_VERSION: ${{ vars.EVIDENCE_KEY_VERSION }}
        run: |
          set -euo pipefail
          node --import tsx scripts/canary-evidence-cli.ts verify > evidence/canary.json
      - name: Compose exact release claims from operational artifacts
        env:
          RELEASE_ID: ${{ vars.RELEASE_ID }}
          EVIDENCE_PRINCIPAL: ${{ vars.EVIDENCE_PRINCIPAL }}
          EVIDENCE_KEY_ID: ${{ vars.EVIDENCE_KEY_ID }}
          EVIDENCE_KEY_VERSION: ${{ vars.EVIDENCE_KEY_VERSION }}
          RELEASE_CLAIMS_TEMPLATE_JSON: ${{ secrets.RELEASE_CLAIMS_TEMPLATE_JSON }}
        run: node --import tsx scripts/compose-release-claims.ts evidence evidence/release-claims.json
      - name: KMS sign, production verify, and atomically consume nonce
        id: kms-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_EVIDENCE_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_EVIDENCE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s
      - name: KMS sign and production verify
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.kms-auth.outputs.access_token }}
          READINESS_CONTROL_DATABASE_URL: ${{ secrets.READINESS_CONTROL_DATABASE_URL }}
          KMS_PROJECT: ${{ vars.KMS_PROJECT }}
          KMS_LOCATION: ${{ vars.KMS_LOCATION }}
          KMS_KEY_RING: ${{ vars.KMS_KEY_RING }}
          KMS_KEY: ${{ vars.KMS_KEY }}
          EVIDENCE_PRINCIPAL: ${{ vars.EVIDENCE_PRINCIPAL }}
          EVIDENCE_KEY_ID: ${{ vars.EVIDENCE_KEY_ID }}
          EVIDENCE_KEY_VERSION: ${{ vars.EVIDENCE_KEY_VERSION }}
          EVIDENCE_TRUST_JSON: ${{ secrets.EVIDENCE_TRUST_JSON }}
        run: node --import tsx scripts/sign-verify-release-evidence.ts evidence/release-claims.json evidence/release-evidence.immutable.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/release-evidence.immutable.json
          if-no-files-found: error
          retention-days: 90
  private-tester-evidence:
    needs: operational-evidence
    runs-on: ubuntu-latest
    environment: production-evidence
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - id: private-tester-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_EVIDENCE_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_EVIDENCE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s
      - name: Require a reviewed immutable evidence build request
        env:
          CLOUD_SQL_AUTH_PROXY_IMAGE: ${{ vars.CLOUD_SQL_AUTH_PROXY_IMAGE }}
          CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
          NEARYOU_PRIVATE_TESTER_BASELINE_DATABASE_USER: ${{ vars.NEARYOU_PRIVATE_TESTER_BASELINE_DATABASE_USER }}
          PRIVATE_TESTER_EVIDENCE_BUCKET: ${{ vars.PRIVATE_TESTER_EVIDENCE_BUCKET }}
          PRIVATE_TESTER_EVIDENCE_OPERATION_ID: ${{ vars.PRIVATE_TESTER_EVIDENCE_OPERATION_ID }}
          PRIVATE_TESTER_EVIDENCE_STARTED_AT: ${{ vars.PRIVATE_TESTER_EVIDENCE_STARTED_AT }}
          PRIVATE_TESTER_BASELINE_DATABASE_URL: ${{ secrets.PRIVATE_TESTER_BASELINE_DATABASE_URL }}
          EVIDENCE_TRUST_JSON: ${{ secrets.EVIDENCE_TRUST_JSON }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.private-tester-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_OAUTH_ACCESS_TOKEN"
          test -n "$EVIDENCE_TRUST_JSON"
          test -n "$PRIVATE_TESTER_EVIDENCE_BUCKET"
          test -n "$PRIVATE_TESTER_EVIDENCE_OPERATION_ID"
          test "$PRIVATE_TESTER_EVIDENCE_STARTED_AT" -gt 0
          test "$CLOUD_SQL_INSTANCE_CONNECTION_NAME" = "nearnight:us-central1:nearyou-production"
          test "$NEARYOU_PRIVATE_TESTER_BASELINE_DATABASE_USER" = "nearyou-pt-baseline@nearnight.iam"
          printf '%s' "$CLOUD_SQL_AUTH_PROXY_IMAGE" | grep -Eq '^gcr\.io/cloud-sql-connectors/cloud-sql-proxy@sha256:[a-f0-9]{64}$'
          test "$PRIVATE_TESTER_BASELINE_DATABASE_URL" = 'postgresql://nearyou-pt-baseline%40nearnight.iam@127.0.0.1:5432/nearyou?sslmode=disable'
          test -z "${PRIVATE_TESTER_BASELINE_DATABASE_PASSWORD:-}"
          test -f infra/production/cloud-sql-auth-proxy.args
          grep -qx -- '--auto-iam-authn' infra/production/cloud-sql-auth-proxy.args
          printf '%s\n' 'Private tester evidence must run in the separately reviewed Cloud Build invocation.'
