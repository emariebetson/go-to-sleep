# Disposable, non-production evidence exercise. The invoking system must stage
# only synthetic receipts under .private-tester-evidence/; no production bucket,
# project, database, or tester data is accepted by this configuration.
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: [EVIDENCE_TRUST_JSON, PRIVATE_TESTER_BASELINE_DATABASE_URL]
    args:
      - -ceu
      - |
        test "${PROJECT_ID}" = "nearyou-private-tester-disposable"
        test "${PROJECT_ID}" != "nearnight"
        test "${_NEARYOU_PRIVATE_TESTER_BASELINE_DATABASE_USER}" = "nearyou-pt-baseline@nearnight.iam"
        test "$${PRIVATE_TESTER_BASELINE_DATABASE_URL}" = 'postgresql://nearyou-pt-baseline%40nearnight.iam@127.0.0.1:5432/nearyou?sslmode=disable'
        printf '%s' "${_CLOUD_SQL_AUTH_PROXY_IMAGE}" | grep -Eq '^gcr\.io/cloud-sql-connectors/cloud-sql-proxy@sha256:[a-f0-9]{64}$'
        docker run --detach --rm --name private-tester-auth-proxy --network cloudbuild "${_CLOUD_SQL_AUTH_PROXY_IMAGE}" --auto-iam-authn --structured-logs --address=127.0.0.1 --port=5432 "${_CLOUD_SQL_INSTANCE_CONNECTION_NAME}"
        trap 'docker rm -f private-tester-auth-proxy >/dev/null 2>&1 || true' EXIT
        docker run --rm --network cloudbuild -v /workspace:/workspace -w /workspace \
          -e EVIDENCE_TRUST_JSON -e PRIVATE_TESTER_EVIDENCE_BUCKET="nearyou-private-tester-evidence-disposable" \
          -e KMS_PROJECT="${_KMS_PROJECT}" -e KMS_LOCATION="${_KMS_LOCATION}" -e KMS_KEY_RING="${_KMS_KEY_RING}" -e KMS_KEY="${_KMS_KEY}" \
          -e EVIDENCE_PRINCIPAL="${_EVIDENCE_PRINCIPAL}" -e EVIDENCE_KEY_ID="${_EVIDENCE_KEY_ID}" \
          node:24-bookworm bash -ceu 'npm ci --ignore-scripts; node --import tsx scripts/run-private-tester-evidence.ts .private-tester-evidence/operation.json .private-tester-evidence/signed-manifest.json .private-tester-evidence/review-baseline.json .private-tester-evidence/provider-log-receipt.json .private-tester-evidence/promoted-baseline.json'
availableSecrets:
  secretManager:
    - versionName: projects/nearyou-private-tester-disposable/secrets/disposable-private-tester-evidence-trust/versions/latest
      env: EVIDENCE_TRUST_JSON
    - versionName: projects/nearyou-private-tester-disposable/secrets/disposable-private-tester-baseline-url/versions/latest
      env: PRIVATE_TESTER_BASELINE_DATABASE_URL
