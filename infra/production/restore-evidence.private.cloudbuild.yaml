# Runs the restored-Cloud-SQL evidence probe only from the private worker pool.
# The invoking identity must be the clone-scoped evidence service account and
# substitutions are non-secret, integrity-bound values captured for this restore.
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        test "${PROJECT_ID}" = "nearnight"
        test "${_RESTORED_CLOUD_SQL_INSTANCE}" = "nearnight:us-central1:nearyou-evidence-20260820"
        mkdir -p evidence
        printf '%s' "${_CLOUD_SQL_AUTH_PROXY_IMAGE}" | grep -Eq '^gcr\.io/cloud-sql-connectors/cloud-sql-proxy@sha256:[a-f0-9]{64}$'
        docker run --detach --rm --name restore-evidence-auth-proxy --network cloudbuild \
          "${_CLOUD_SQL_AUTH_PROXY_IMAGE}" --auto-iam-authn --private-ip --structured-logs --address=0.0.0.0 --port=5432 \
          "${_RESTORED_CLOUD_SQL_INSTANCE}"
        trap 'docker rm -f restore-evidence-auth-proxy >/dev/null 2>&1 || true' EXIT
        docker run --rm --network cloudbuild -v /workspace:/workspace -w /workspace \
          -e CLOUD_SQL_RESTORE_OPERATION="${_CLOUD_SQL_RESTORE_OPERATION}" \
          -e RESTORE_EXPECTED_CHECKSUM="${_RESTORE_EXPECTED_CHECKSUM}" \
          -e RESTORE_EXPECTED_CATALOG_CHECKSUM="${_RESTORE_EXPECTED_CATALOG_CHECKSUM}" \
          -e RESTORE_GCP_PROJECT=nearnight \
          -e RESTORED_DATABASE_URL='postgresql://nearyou-evidence-ci%40nearnight.iam@restore-evidence-auth-proxy:5432/nearyou?sslmode=disable' \
          node:24-bookworm bash -ceu '
            npm install --prefix /tmp/restore-evidence-runtime --ignore-scripts --no-save pg@8.16.3 tsx@4.22.1
            test ! -e /workspace/node_modules
            ln -s /tmp/restore-evidence-runtime/node_modules /workspace/node_modules
            export GOOGLE_OAUTH_ACCESS_TOKEN="$(node -e '\''fetch("http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token",{headers:{"Metadata-Flavor":"Google"}}).then(r=>{if(!r.ok)throw new Error("metadata token unavailable");return r.json()}).then(v=>process.stdout.write(v.access_token))'\'')"
            /tmp/restore-evidence-runtime/node_modules/.bin/tsx scripts/restore-evidence-cli.ts evidence/restore.json
          '
artifacts:
  objects:
    location: gs://nearyou-production-private-evidence-nearnight/restores/$BUILD_ID
    paths: [evidence/restore.json]
serviceAccount: projects/nearnight/serviceAccounts/nearyou-evidence-ci@nearnight.iam.gserviceaccount.com
options:
  pool:
    name: projects/nearnight/locations/us-central1/workerPools/nearfamily-evidence-private
  logging: CLOUD_LOGGING_ONLY
